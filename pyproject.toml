[project]
name = "asura-mlkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [

    # fast computing
    "numpy",

    # data loading and operations on table-shaped data
    "pandas",

    # visualization & plots
    "seaborn",
    "matplotlib",

    # machine learning algorithms
    "scikit-learn",

    # to dowload datasets
    "kagglehub",

    # computer vision
    "opencv-python",

    # PyTorch
    "torch",
    # "torchtext",  # deprecated
    "torchaudio",
    "torchvision",

    # NLP
    "spacy",
    "nltk"
]
